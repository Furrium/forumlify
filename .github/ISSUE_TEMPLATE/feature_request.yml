name: ✨ 功能建议 / Feature Request
description: 提出一个新功能或改进建议 / Suggest an idea for this project
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你的建议！/ Thanks for your suggestion!
        请填写以下信息，让我们了解你的想法。/ Please fill in the information below to help us understand your idea.

  - type: dropdown
    id: branch
    attributes:
      label: 这个功能针对哪个分支？/ Which branch is this feature for?
      description: 请选择你所使用的分支。/ Please select the branch you are using.
      options:
        - Lite（原生单文件版 / Original single-file version）
        - next（Next.js 16 版 / Next.js 16 version）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 后台版本号 / Backend version (管理员填写 / admins only)
      description: |
        如果你使用的是 next 分支且是管理员，请粘贴后台显示的版本号。其他情况请留空。
        / If you are using the next branch and are an administrator, please paste the version shown in the admin panel. Leave blank otherwise.
      placeholder: "例如 / e.g. 2.0.0"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 这个功能解决什么问题？/ What problem does this feature solve?
      placeholder: "当我...时，我希望... / When I ..., I wish ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed solution
      description: 你希望如何实现？/ How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 你考虑过其他方案吗？/ Have you considered any alternative approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明 / Additional context
      description: 其他任何信息、截图或示例。/ Any other information, screenshots, or examples.
    validations:
      required: false
